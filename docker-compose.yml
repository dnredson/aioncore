services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: aioncore-postgres
    environment:
      POSTGRES_DB: aioncore
      POSTGRES_USER: aioncore
      POSTGRES_PASSWORD: aioncore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aioncore -d aioncore"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2
    container_name: aioncore-nats
    ports:
      - "4222:4222"
      - "8222:8222"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aioncore-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

volumes:
  postgres-data:
