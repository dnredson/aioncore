[workspace]
members = [
    "apps/aion-api",
    "crates/aion-action",
    "crates/aion-dlq",
    "crates/aion-entity",
    "crates/aion-event",
    "crates/aion-flow",
    "crates/aion-mcp",
    "crates/aion-observation",
    "crates/aion-payload",
    "crates/aion-raw-message",
    "crates/aion-relationship",
    "crates/aion-rule",
    "crates/aion-storage",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/aioncore/aioncore"

[workspace.dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["serde", "v4"] }

aion-entity = { path = "crates/aion-entity" }
aion-action = { path = "crates/aion-action" }
aion-dlq = { path = "crates/aion-dlq" }
aion-event = { path = "crates/aion-event" }
aion-flow = { path = "crates/aion-flow" }
aion-mcp = { path = "crates/aion-mcp" }
aion-observation = { path = "crates/aion-observation" }
aion-payload = { path = "crates/aion-payload" }
aion-raw-message = { path = "crates/aion-raw-message" }
aion-relationship = { path = "crates/aion-relationship" }
aion-rule = { path = "crates/aion-rule" }
aion-storage = { path = "crates/aion-storage" }
